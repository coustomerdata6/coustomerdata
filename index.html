    const {
      error

      user_id: user.id,
      key,
      value
    }, {
      onConflict: 'user_id,key'

    return {
      value
    };
  },
  async delete(key) {
    if (!_supabase) return {
      deleted: false

      data: {
        user
      }
    } = await _supabase.auth.getUser();
    if (!user) return {
      deleted: false
    };

    return {
      deleted: true
    };
  },
  async list(prefix) {

      keys: []

      data: {
        user
      }

    if (!user) return {
